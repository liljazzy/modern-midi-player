# Builds the Windows installer and publishes a GitHub Release whenever a
# version tag (v1.2.3) is pushed.  Installed copies of the app check this
# repository's releases and offer the update to users.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          APP=$(python -c "import midiplayer; print(midiplayer.__version__)")
          TAG="${GITHUB_REF_NAME#v}"
          echo "app=$APP tag=$TAG"
          test "$APP" = "$TAG" || { echo "::error::Tag v$TAG does not match midiplayer/__init__.py version $APP"; exit 1; }

      - name: Tests
        env:
          PYTHONUTF8: "1"
        run: |
          python -m unittest tests.test_core tests.test_updater
          python tests/smoke_ui.py

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pillow
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      - name: Build installer
        env:
          MMP_UPDATE_REPO: ${{ github.repository }}
        run: python installer/build_installer.py

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          python - <<'PY'
          import re, midiplayer
          v = midiplayer.__version__
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(v)}\s*\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          open("release-notes.md", "w", encoding="utf-8").write((m.group(1).strip() if m else f"Version {v}") + "\n")
          PY

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Modern MIDI Player ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/ModernMidiPlayer-Setup-*.exe
            dist/ModernMidiPlayer-Setup-*.exe.sha256

      - name: Upload build (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/ModernMidiPlayer-Setup-*
